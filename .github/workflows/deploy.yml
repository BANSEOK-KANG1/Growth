name: Deploy Astro site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          # 개인 메인 사이트(username.github.io)면 BASE_PATH는 비워둡니다.
          # 프로젝트 저장소 방식이면 GitHub Repository Variables에 BASE_PATH=/growth-performance-portfolio 를 추가하세요.
          BASE_PATH: ${{ vars.BASE_PATH }}
          SITE_URL: ${{ vars.SITE_URL }}
          PUBLIC_META_CREATIVE_APP_URL: ${{ vars.PUBLIC_META_CREATIVE_APP_URL }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
